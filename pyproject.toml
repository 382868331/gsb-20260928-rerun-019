[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "procedural-terrain-system"
version = "0.1.0"
description = "Deterministic chunked height terrain with persistent local edits"
requires-python = ">=3.11"

[project.scripts]
terrain = "terrain_system.cli:main"

[tool.setuptools.packages.find]
include = ["terrain_system*"]
